name: Build DRUM PRO X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract Project ZIP
        run: |
          unzip -q DRUM_PRO_X_Android_Project.zip -d source

      - name: Build APK
        run: |
          cd source/DRUM_PRO_X
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRUM-PRO-X-APK
          path: source/DRUM_PRO_X/app/build/outputs/apk/debug/app-debug.apk
